name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            binary: target/release/mymedia-server
          - platform: windows-x86_64
            runner: windows-latest
            binary: target/release/mymedia-server.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Resolve release version
        id: metadata
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $manifest = Get-Content Cargo.toml -Raw
            $match = [regex]::Match($manifest, '(?ms)\[workspace\.package\].*?^version\s*=\s*"([^"]+)"')
            if (-not $match.Success) { throw 'Workspace version not found' }
            $version = "$($match.Groups[1].Value)-dev.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate release identity
        env:
          ZMYDIA_UPDATE_PUBLIC_KEY: ${{ vars.ZMYDIA_UPDATE_PUBLIC_KEY }}
        run: node scripts/validate-release-version.mjs --version "${{ steps.metadata.outputs.version }}"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build native server
        env:
          ZMYDIA_BUILD_VERSION: ${{ steps.metadata.outputs.version }}
          ZMYDIA_UPDATE_PUBLIC_KEY: ${{ vars.ZMYDIA_UPDATE_PUBLIC_KEY }}
        run: cargo build --locked --release -p mymedia-server

      - name: Download verified Linux runtime tools
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: .github/scripts/prepare-runtime-linux.sh .release/runtime

      - name: Download verified Windows runtime tools
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: .github/scripts/prepare-runtime-windows.ps1 -OutputDirectory .release/runtime

      - name: Assemble release package
        shell: pwsh
        run: |
          node scripts/package-release.mjs `
            --platform "${{ matrix.platform }}" `
            --version "${{ steps.metadata.outputs.version }}" `
            --binary "${{ matrix.binary }}" `
            --runtime .release/runtime `
            --output dist

      - name: Validate packaged release identity
        env:
          ZMYDIA_UPDATE_PUBLIC_KEY: ${{ vars.ZMYDIA_UPDATE_PUBLIC_KEY }}
        shell: pwsh
        run: |
          node scripts/validate-release-version.mjs `
            --version "${{ steps.metadata.outputs.version }}" `
            --binary "${{ matrix.binary }}" `
            --package "dist/zmydia-${{ steps.metadata.outputs.version }}-${{ matrix.platform }}" `
            --platform "${{ matrix.platform }}"

      - name: Smoke-test Linux package
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          package="dist/zmydia-${{ steps.metadata.outputs.version }}-${{ matrix.platform }}"
          "$package/bin/zmydia-server" --help
          "$package/lib/mymedia/bin/ffmpeg" -version
          "$package/lib/mymedia/bin/ffprobe" -version
          "$package/lib/mymedia/bin/yt-dlp" --version
          "$package/lib/mymedia/bin/curl" --version
          "$package/bin/zmydia-server" service --help
          highest_glibc="$(readelf --version-info "$package/bin/zmydia-server" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)"
          echo "Highest required glibc symbol: $highest_glibc"
          maximum_glibc="$(printf '%s\n%s\n' 'GLIBC_2.35' "$highest_glibc" | sort -Vu | tail -1)"
          if [ "$maximum_glibc" != 'GLIBC_2.35' ]; then
            echo "Linux server requires a glibc newer than 2.35" >&2
            exit 1
          fi
          export MYMEDIA_DATA_DIR="$RUNNER_TEMP/mymedia-data"
          export MYMEDIA_CACHE_DIR="$RUNNER_TEMP/mymedia-cache"
          export MYMEDIA_KEY_PATH="$RUNNER_TEMP/mymedia-master.key"
          head -c 32 /dev/urandom > "$MYMEDIA_KEY_PATH"
          PATH=/usr/bin:/bin "$package/bin/zmydia-server" diagnose

      - name: Smoke-test Windows package
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $package = "dist/zmydia-${{ steps.metadata.outputs.version }}-${{ matrix.platform }}"
          & "$package/bin/zmydia-server.exe" --help
          & "$package/lib/mymedia/bin/ffmpeg.exe" -version
          & "$package/lib/mymedia/bin/ffprobe.exe" -version
          & "$package/lib/mymedia/bin/yt-dlp.exe" --version
          & "$package/lib/mymedia/bin/curl.exe" --version
          $env:MYMEDIA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'mymedia-data'
          $env:MYMEDIA_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'mymedia-cache'
          $env:MYMEDIA_KEY_PATH = Join-Path $env:RUNNER_TEMP 'mymedia-master.key'
          $key = New-Object byte[] 32
          [Security.Cryptography.RandomNumberGenerator]::Fill($key)
          [IO.File]::WriteAllBytes($env:MYMEDIA_KEY_PATH, $key)
          & "$package/bin/zmydia-server.exe" diagnose
          if ($LASTEXITCODE -ne 0) { throw 'Packaged server diagnostic failed' }

      - name: Create Linux packages and installer
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          mkdir -p release-assets
          package="zmydia-${{ steps.metadata.outputs.version }}-${{ matrix.platform }}"
          tar -czf "release-assets/${package}.tar.gz" -C dist "$package"
          archive_sha256="$(sha256sum "release-assets/${package}.tar.gz" | cut -d' ' -f1)"
          installer="release-assets/${package}-installer.sh"
          sed \
            -e "s/__ZMYDIA_VERSION__/${{ steps.metadata.outputs.version }}/g" \
            -e "s/__ZMYDIA_ARCHIVE_SHA256__/$archive_sha256/g" \
            scripts/install-linux.sh > "$installer"
          chmod +x "$installer"
          "$installer" --help
          bash scripts/test-linux-installer.sh "$installer"
          bash scripts/package-deb.sh \
            "dist/$package" \
            "${{ steps.metadata.outputs.version }}" \
            release-assets

      - name: Smoke-test Debian package
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          deb="release-assets/zmydia_${{ steps.metadata.outputs.version }}_amd64.deb"
          dpkg-deb --info "$deb"
          sudo dpkg --install "$deb"
          /usr/lib/zmydia/bin/zmydia-server --help
          test -x /usr/bin/zmydia
          test -f /usr/lib/systemd/user/zmydia.service
          test -f /usr/share/applications/zmydia.desktop
          systemd-analyze --user verify zmydia.service zmydia-backup.service zmydia-backup.timer
          sudo dpkg --remove zmydia
          test ! -e /usr/lib/zmydia

      - name: Install NSIS
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: choco install nsis --version=3.11 --no-progress -y

      - name: Create Windows installer
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $package = "zmydia-${{ steps.metadata.outputs.version }}-${{ matrix.platform }}"
          $packageDirectory = (Resolve-Path "dist/$package").Path
          $outputFile = Join-Path (Resolve-Path release-assets).Path "$package-installer.exe"
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = (Get-Command makensis.exe -ErrorAction Stop).Source
          }
          $nsisLicense = Join-Path $env:RUNNER_TEMP 'nsis-COPYING.txt'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/NSIS-Dev/nsis/v311/COPYING' -OutFile $nsisLicense
          $nsisLicenseHash = (Get-FileHash -Algorithm SHA256 $nsisLicense).Hash.ToLowerInvariant()
          if ($nsisLicenseHash -ne 'dc0f74a312c08ffc900548a67ae9a3670ed28ad25a3afda1fe0504da16f89361') {
            throw 'NSIS license checksum mismatch'
          }
          Copy-Item $nsisLicense (Join-Path $packageDirectory 'licenses\nsis-COPYING.txt')
          & $makensis `
            "/DPACKAGE_DIR=$packageDirectory" `
            "/DOUTPUT_FILE=$outputFile" `
            "/DPRODUCT_VERSION=${{ steps.metadata.outputs.version }}" `
            installer/windows.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS failed to build the installer' }

      - name: Smoke-test Windows installer
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $installer = (Resolve-Path "release-assets/zmydia-${{ steps.metadata.outputs.version }}-${{ matrix.platform }}-installer.exe").Path
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }
          $installDirectory = Join-Path $env:LOCALAPPDATA 'Programs\ZMydia'
          & (Join-Path $installDirectory 'bin\zmydia-server.exe') --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed server failed its smoke test' }
          Get-ScheduledTask -TaskName ZMydia -ErrorAction Stop | Out-Null
          Get-ScheduledTask -TaskName 'ZMydia Backup' -ErrorAction Stop | Out-Null
          $upgrade = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Silent upgrade failed with exit code $($upgrade.ExitCode)" }
          $ready = Invoke-RestMethod -Uri 'http://127.0.0.1:4173/api/health/ready' -TimeoutSec 10
          if ($ready.status -ne 'ready' -or $ready.version -ne '${{ steps.metadata.outputs.version }}') {
            throw 'Upgraded Windows service did not report the expected ready version'
          }
          $uninstall = Start-Process -FilePath (Join-Path $installDirectory 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)" }
          if (Get-ScheduledTask -TaskName ZMydia -ErrorAction SilentlyContinue) {
            throw 'ZMydia scheduled task remained after uninstall'
          }
          if (Get-ScheduledTask -TaskName 'ZMydia Backup' -ErrorAction SilentlyContinue) {
            throw 'ZMydia backup task remained after uninstall'
          }

      - name: Upload release installers
        uses: actions/upload-artifact@v4
        with:
          name: zmydia-${{ matrix.platform }}
          path: release-assets/zmydia*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Download release archives
        uses: actions/download-artifact@v5
        with:
          pattern: zmydia-*
          path: release-assets
          merge-multiple: true

      - name: Generate signed update manifest
        env:
          ZMYDIA_UPDATE_SIGNING_KEY: ${{ secrets.ZMYDIA_UPDATE_SIGNING_KEY }}
          ZMYDIA_UPDATE_PUBLIC_KEY: ${{ vars.ZMYDIA_UPDATE_PUBLIC_KEY }}
        run: |
          node scripts/generate-update-manifest.mjs \
            --assets release-assets \
            --output release-assets \
            --version "${GITHUB_REF_NAME#v}" \
            --min-updater-version 0.1.1

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum zmydia* > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "ZMydia $GITHUB_REF_NAME"
          fi

      - name: Update Nix binary release pin
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="release-assets/zmydia-${version}-linux-x86_64.tar.gz"
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          git fetch origin main
          git switch --force-create main FETCH_HEAD
          node -e 'const fs=require("fs"); const path="nix/release.json"; const data=JSON.parse(fs.readFileSync(path)); data.version=process.argv[1]; data.linux_x86_64_sha256=process.argv[2]; fs.writeFileSync(path, JSON.stringify(data, null, 2)+"\n");' "$version" "$digest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/release.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Nix package to ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
