[workspace]
members = ["crates/server"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.2"

[workspace.dependencies]
argon2 = { version = "0.6", features = ["password-hash", "rand_core"] }
axum = "0.8"
base64 = "0.23"
fs2 = "0.4"
http = "1"
mimalloc = { version = "0.1", default-features = false }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Pin temporário no upstream oficial: SQLx 0.9.0 limita libsqlite3-sys a
# versões vulneráveis; este commit aceita 0.39.x (SQLite 3.54 corrigido).
sqlx = { git = "https://github.com/transact-rs/sqlx", rev = "987b8c5a74b6da8b71da6b5549925a7f6e59aac9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
walkdir = "2"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
